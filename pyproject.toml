[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "x-sidechain"
version = "0.2.0"
description = "Evidence-first multi-provider AI deliberation for Linux"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "gsmarcil" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
x-sidechain = "x_sidechain.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
